# Include INSIDE the existing server block, keeping the portal auth_request.
# The adapter must not have a published host port.
location ^~ /storage/v1/ {
    client_max_body_size 11m;
    proxy_pass http://inova-livros-storage:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 35s;
}
