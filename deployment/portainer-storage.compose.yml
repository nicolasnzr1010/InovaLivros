services:
  inova-livros:
    image: nginx:1.27-alpine
    container_name: inova-livros
    restart: unless-stopped
    depends_on:
      inova-livros-storage:
        condition: service_healthy
    ports: ["8082:80"]
    environment:
      GITHUB_TOKEN: ${GITHUB_TOKEN}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        wget -q --header="Authorization: Bearer $$GITHUB_TOKEN" https://api.github.com/repos/sectidev/InovaLivros/tarball/main -O /tmp/app.tar.gz
        mkdir -p /tmp/app
        tar -xzf /tmp/app.tar.gz --strip-components=1 -C /tmp/app
        cp -r /tmp/app/dist/. /usr/share/nginx/html/
        echo '' | base64 -d > /tmp/storage-location.conf
        sed '/^server {/r /tmp/storage-location.conf' /tmp/app/nginx.conf > /etc/nginx/conf.d/default.conf
        nginx -t
        unset GITHUB_TOKEN
        exec nginx -g 'daemon off;'
    networks: [secti]
  inova-livros-storage:
    image: node:24-alpine
    container_name: inova-livros-storage
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      STORAGE_SOURCE: ""
      STORAGE_ROOT: /data/capas
    command: ["node","-e","eval(Buffer.from(process.env.STORAGE_SOURCE, 'base64').toString())"]
    volumes:
      - inova_livros_capas:/data
    networks: [secti]
    healthcheck:
      test: ["CMD","node","-e","fetch('http://127.0.0.1:8080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
volumes:
  inova_livros_capas:
networks:
  secti:
    external: true
